name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types (TypeScript + svelte-check)
        run: npm run check
      - name: Tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  # Les mêmes tests contre un vrai PostgreSQL (pas seulement PGlite) et un vrai Redis.
  services:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: refrain
          POSTGRES_PASSWORD: refrain
          POSTGRES_DB: refrain
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U refrain" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://refrain:refrain@localhost:5432/refrain
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: [test, services]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: refrain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
